[package]
name = "wrpc-http"
version = "0.2.0-rc.1"
description = "wRPC HTTP transport"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
futures = { workspace = true, features = ["std"] }
h2 = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tower-service = { workspace = true }
wrpc-core = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
test-log = { workspace = true, features = ["color", "log", "trace"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { workspace = true, features = ["util"] }
wrpc-test = { workspace = true, features = ["http"] }
