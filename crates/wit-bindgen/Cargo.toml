[package]
name = "wit-bindgen-wrpc"
version = "0.13.0-rc.1"
description = """
Rust bindings generator for wRPC.
"""
authors = [
    "Roman Volosatovs <rvolosatovs@riseup.net>",
    "Alex Crichton <alex@alexcrichton.com>",
]

categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bitflags = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
wasm-tokio = { workspace = true }
wit-bindgen-wrpc-rust-macro = { workspace = true }
wrpc-core = { workspace = true }

[features]
default = ["macro-string"]
macro-string = ["wit-bindgen-wrpc-rust-macro/macro-string"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt"] }
