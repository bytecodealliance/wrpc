[package]
name = "wrpc-websockets"
version = "0.2.0"
description = "wRPC WebSocket transport"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tokio-websockets = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true, features = ["std"] }
test-log = { workspace = true, features = ["color", "log", "trace"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-websockets = { workspace = true, features = ["client", "rand", "ring", "server"] }
wrpc-test = { workspace = true, features = ["websockets"] }
