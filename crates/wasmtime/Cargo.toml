[package]
name = "wrpc-wasmtime"
version = "0.2.0"
description = "wRPC wasmtime integration"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["async"]
async = ["wasmtime/component-model-async"]

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bytes = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true, features = ["attributes"] }
wasm-tokio = { workspace = true }
wasmparser = { workspace = true, features = ["component-model", "validate"] }
wasmtime = { workspace = true, features = ["anyhow", "component-model", "runtime", "std"] }
wrpc-core = { workspace = true }

[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
wrpc-test = { workspace = true }

[[test]]
name = "loopback"
required-features = ["async"]
