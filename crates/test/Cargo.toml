[package]
name = "wrpc-test"
version = "0.5.0"
description = "wRPC test utilities"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["http", "quic", "websockets", "webtransport"]
http = ["dep:http", "dep:hyper", "dep:hyper-util", "dep:wrpc-http"]
net = ["dep:tempfile", "wrpc-transport/net"]
quic = ["dep:quinn"]
websockets = ["dep:http", "dep:tokio-websockets", "dep:wrpc-websockets"]
webtransport = ["dep:quinn", "dep:url", "dep:web-transport-quinn"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true, optional = true }
hyper = { workspace = true, features = [
    "client",
    "http1",
    "http2",
    "server",
], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"], optional = true }
quinn = { workspace = true, features = [
    "log",
    "platform-verifier",
    "ring",
    "runtime-tokio",
    "rustls",
], optional = true }
rcgen = { workspace = true, features = ["crypto", "ring", "zeroize"] }
rustls = { workspace = true, features = ["logging", "ring", "std"] }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tokio-websockets = { workspace = true, features = [
    "client",
    "rand",
    "ring",
    "server",
], optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
web-transport-quinn = { workspace = true, optional = true }
wrpc-http = { workspace = true, features = ["client", "http2", "server"], optional = true }
wrpc-transport = { workspace = true }
wrpc-websockets = { workspace = true, optional = true }
