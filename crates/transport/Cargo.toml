[package]
name = "wrpc-transport"
version = "0.31.0"
description = "wRPC core transport functionality"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["fs", "net", "io-std"]
fs = ["tokio/fs"]
net = ["tokio/net", "wrpc-test/net"]
io-std = ["tokio/io-std"]
wasi = ["dep:anyhow", "dep:wasi"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true, features = ["std"] }
send-future = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true, features = ["attributes"] }
wasm-tokio = { workspace = true, features = ["tracing"] }

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow = { workspace = true, features = ["std"], optional = true }
wasi = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
anyhow = { workspace = true, features = ["std"] }
test-log = { workspace = true, features = ["color", "log", "trace"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wrpc-test = { workspace = true }
