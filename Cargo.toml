[package]
description = "WebAssembly component-native RPC framework based on WIT"
name = "wrpc"
version = "0.19.0-rc.2"

authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
features = ["h2", "http", "wasmtime", "wasmtime-async", "wave"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace.package]
authors = ["Roman Volosatovs <rvolosatovs@riseup.net>"]
categories = ["wasm"]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wrpc"

[workspace]
members = [
    "benches/reactor",
    "crates/*",
    "examples/rust/*",
    "examples/web/rust",
    "tests/wasm32",
]

[features]
default = [
    "bin",
    "h2",
    "http",
    "wasmtime",
    "wasmtime-async",
]

bin = ["bin-bindgen", "bin-wasmtime"]
bin-bindgen = [
    "dep:clap",
    "dep:wit-bindgen-core",
    "dep:wit-bindgen-wrpc-go",
    "dep:wit-bindgen-wrpc-js",
    "dep:wit-bindgen-wrpc-test",
    "wit-bindgen-wrpc-go/clap",
    "wit-bindgen-wrpc-js/clap",
    "wit-bindgen-wrpc-rust/clap",
]
bin-wasmtime = ["dep:tokio", "dep:wrpc-wasmtime-cli", "tokio/rt-multi-thread"]
http = ["dep:wrpc-http"]
h2 = ["http", "wrpc-http/h2"]
wasmtime = ["dep:wrpc-wasmtime"]
wasmtime-async = ["wrpc-wasmtime?/async"]
wave = ["dep:wrpc-wave"]

[[bin]]
name = "wit-bindgen-wrpc"
required-features = ["bin-bindgen"]
doc = false

[[bin]]
name = "wrpc-wasmtime"
required-features = ["bin-wasmtime"]
doc = false

[[bench]]
name = "bench"
harness = false

[profile.bench]
debug = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true, features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, features = ["attributes"] }
wit-bindgen-core = { workspace = true, optional = true }
wit-bindgen-wrpc = { workspace = true }
wit-bindgen-wrpc-go = { workspace = true, optional = true }
wit-bindgen-wrpc-js = { workspace = true, optional = true }
wit-bindgen-wrpc-rust = { workspace = true, optional = true }
wit-bindgen-wrpc-test = { workspace = true, optional = true }
wrpc-core = { workspace = true }
wrpc-http = { workspace = true, optional = true }
wrpc-wasmtime = { workspace = true, optional = true }
wrpc-wasmtime-cli = { workspace = true, optional = true }
wrpc-wave = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true, features = [
    "async_tokio",
    "cargo_bench_support",
    "html_reports",
    "plotters",
    "rayon",
] }
futures = { workspace = true, features = ["async-await"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tempfile = { workspace = true }
test-log = { workspace = true, features = ["color", "log", "trace"] }
tokio = { workspace = true, features = ["net", "process", "rt-multi-thread"] }
tokio-util = { workspace = true }
wasmtime = { workspace = true, features = ["component-model-async", "cranelift", "wat"] }
wasmtime-wasi = { workspace = true }
wasmtime-cli-flags = { workspace = true, features = [
    "async",
    "cache",
    "component-model",
    "coredump",
    "cranelift",
    "gc",
    "memory-protection-keys",
    "parallel-compilation",
    "pooling-allocator",
    "threads",
] }
wrpc-test = { workspace = true, features = [
    "http",
    "net",
    "quic",
    "webtransport",
] }

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false }
bitflags = { version = "2", default-features = false }
bytes = { version = "1.7", default-features = false }
clap = { version = "4", default-features = false }
criterion = { version = "0.8", default-features = false }
futures = { version = "0.3", default-features = false }
h2 = { version = "0.4", default-features = false }
heck = { version = "0.5", default-features = false }
http = { version = "1", default-features = false }
http-body = { version = "1", default-features = false }
http-body-util = { version = "0.1", default-features = false }
humantime = { version = "2.1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
macro-string = { version = "0.2", default-features = false }
prettyplease = { version = "0.2.37", default-features = false }
proc-macro2 = { version = "1", default-features = false }
quinn = { version = "0.11.6", default-features = false }
quote = { version = "1", default-features = false }
rayon = { version = "1", default-features = false }
rcgen = { version = "0.14", default-features = false }
redis = { version = "1.2", default-features = false }
regex = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["printing"] }
tempfile = { version = "3", default-features = false }
test-log = { version = "0.2", default-features = false }
time = { version = "0.3", default-features = false }
tokio = { version = "1.50", default-features = false }
tokio-io-timeout = { version = "1.2.1", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7.12", default-features = false }
toml = { version = "1.1", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
url = { version = "2" }
uuid = { version = "1", default-features = false }
wasi = { version = "0.14", default-features = false }
wasi-preview1-component-adapter-provider = { version = "50", default-features = false }
wasm-tokio = { version = "0.9.1", default-features = false }
wasm-wave = { version = "0.263", default-features = false }
wasmparser = { version = "0.263", default-features = false }
wasmtime = { version = "51", default-features = false }
wasmtime-cli-flags = { version = "51", default-features = false }
wasmtime-wasi = { version = "51", default-features = false }
wasmtime-wasi-http = { version = "51", default-features = false }
web-transport-quinn = { version = "0.13.5", default-features = false }
wit-bindgen = { version = "0.60", default-features = false }
wit-bindgen-core = { version = "0.60", default-features = false }
wit-bindgen-wrpc = { version = "0.13.0-rc.2", default-features = false, path = "./crates/wit-bindgen" }
wit-bindgen-wrpc-go = { version = "0.15.0-rc.2", default-features = false, path = "./crates/wit-bindgen-go" }
wit-bindgen-wrpc-js = { version = "0.1.0-rc.2", default-features = false, path = "./crates/wit-bindgen-js" }
wit-bindgen-wrpc-rust = { version = "0.13.0-rc.2", default-features = false, path = "./crates/wit-bindgen-rust" }
wit-bindgen-wrpc-rust-macro = { version = "0.13.0-rc.2", default-features = false, path = "./crates/wit-bindgen-rust-macro" }
wit-bindgen-wrpc-test = { version = "0.2.0-rc.2", default-features = false, path = "./crates/wit-bindgen-test" }
wit-component = { version = "0.263", default-features = false }
wit-parser = { version = "0.254", default-features = false }
wrpc = { version = "0.19.0-rc.2", path = ".", default-features = false }
wrpc-core = { version = "0.1.0-rc.2", path = "./crates/core", default-features = false }
wrpc-http = { version = "0.2.0-rc.2", path = "./crates/http", default-features = false }
wrpc-introspect = { version = "0.9.0-rc.2", default-features = false, path = "./crates/introspect" }
wrpc-test = { path = "./crates/test", default-features = false }
wrpc-wasi-keyvalue = { version = "0.4.0-rc.2", path = "./crates/wasi-keyvalue", default-features = false }
wrpc-wasi-keyvalue-mem = { version = "0.4.0-rc.2", path = "./crates/wasi-keyvalue-mem", default-features = false }
wrpc-wasi-keyvalue-redis = { version = "0.4.0-rc.2", path = "./crates/wasi-keyvalue-redis", default-features = false }
wrpc-wasmtime = { version = "0.2.0-rc.2", path = "./crates/wasmtime", default-features = false }
wrpc-wasmtime-cli = { version = "0.11.0-rc.2", path = "./crates/wasmtime-cli", default-features = false }
wrpc-wave = { version = "0.2.0-rc.2", path = "./crates/wave", default-features = false }
